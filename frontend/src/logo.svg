      <stop offset="50%" stop-color="#818cf8"></stop>
      <stop offset="100%" stop-color="#a78bfa"></stop>
    </linearGradient>
    <linearGradient id="diamondCoolSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"></stop>
